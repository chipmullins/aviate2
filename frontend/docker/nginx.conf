# Aviate web server: serves the Angular app and routes everything else.
#   /api, /sanctum, /up  -> Laravel (php-fpm in the "api" container)
#   /app                 -> Reverb WebSockets (the "reverb" container)
#   /storage             -> uploaded photos (shared volume)

# Docker's internal DNS, so containers can restart without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# Behind Caddy (a public server), every request arrives from Caddy's private Docker address.
# Take the visitor's real IP from the X-Forwarded-For header Caddy sets, but only when the
# request comes from a private address. Caddy replaces any X-Forwarded-For a visitor sends,
# so it can't be faked, and rate limits apply per visitor instead of to everyone at once.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $forwarded_https {
  https   on;
  default '';
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 8m;

  root /usr/share/nginx/html;
  index index.html;

  # ---- Security headers (sent on every response) ----
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # ---- Laravel ----
  location ~ ^/(api|sanctum|up)(/|$) {
    set $php api:9000;
    fastcgi_pass $php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTPS $forwarded_https;
    fastcgi_read_timeout 60s;
  }

  # ---- WebSockets (Reverb). Only the client path /app is public; Reverb's HTTP API (/apps) is not. ----
  location /app/ {
    set $ws reverb:8080;
    proxy_pass http://$ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 120s;
  }

  # ---- Uploaded photos. Always served as images, never executed. ----
  location /storage/ {
    alias /var/www/storage/;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    location ~* \.(?!(jpe?g|png|webp|gif)$)[^.]+$ { return 404; }
  }

  # ---- Angular ----
  # Hashed build files never change, so cache them for a year.
  location ~* \.(?:js|css|woff2?|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }

  # Hidden files (.env, .git, ...) are never served.
  location ~ /\. { deny all; }
}
